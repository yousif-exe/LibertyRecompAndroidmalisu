name: Android Mali test APK

on:
  push:
    branches: [experiment/mali-g720-system-vulkan]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Build installable Android APK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK and NDK used by the APK build scripts
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865"
      - name: Install CMake and Ninja
        shell: bash
        run: python -m pip install "cmake>=3.29,<5" ninja
      - name: Initialize pinned dependencies and patches
        shell: bash
        run: python tools/setup_repo.py
      - name: Build Android native engine and stage runtime libraries
        shell: bash
        env:
          NDK_VER: 29.0.14206865
          BUILD_TYPE: Release
        run: bash os/android/scripts/build_native.sh 2
      - name: Build Vulkan driver proxy and stage libraries
        shell: bash
        env:
          NDK_VER: 29.0.14206865
        run: bash os/android/scripts/build_driver_proxy.sh
      - name: Package debug-signed APK
        shell: bash
        run: |
          cd os/android
          ./gradlew --no-daemon assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: libertyrecomp-mali-test-apk
          path: os/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
